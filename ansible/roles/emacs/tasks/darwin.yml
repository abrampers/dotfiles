---
- name: emacs | darwin | configure emacs-plus tap
  community.general.homebrew_tap:
    name: d12frosted/emacs-plus
    state: present

- name: emacs | darwin | install Emacs formula
  community.general.homebrew:
    name: "{{ editors_emacs_formula }}"
    install_options: "{{ editors_emacs_install_options }}"
    state: present

- name: emacs | darwin | verify Emacs app source
  ansible.builtin.stat:
    path: "{{ editors_emacs_app_source }}"
  register: emacs_app
  changed_when: false

- name: emacs | darwin | assert Emacs app source exists
  ansible.builtin.assert:
    that:
      - emacs_app.stat.exists
    fail_msg: >-
      Expected Emacs app at {{ editors_emacs_app_source }} after installing
      {{ editors_emacs_formula }}.
    success_msg: "Emacs app detected at {{ editors_emacs_app_source }}."

- name: emacs | darwin | link Emacs app
  ansible.builtin.file:
    src: "{{ editors_emacs_app_source }}"
    dest: "{{ editors_emacs_app_destination }}"
    state: link

- name: emacs | darwin | check Emacs server brew service
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew services list"
  register: emacs_service_list
  changed_when: false

- name: emacs | darwin | start Emacs server at login (emacs --fg-daemon)
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew services start {{ editors_emacs_formula }}"
  when: (emacs_service_list.stdout_lines | select('match', '^' ~ editors_emacs_formula ~ '\s+started') | list | length) == 0
