---
- name: agy | darwin entrypoint
  ansible.builtin.import_tasks: darwin.yml
  when: ansible_facts['os_family'] == 'Darwin'

- name: agy | unsupported platform placeholder
  ansible.builtin.debug:
    msg: "Antigravity (agy) role currently supports Darwin only."
  when: ansible_facts['os_family'] != 'Darwin'
