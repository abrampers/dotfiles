---
- name: git | darwin | install git
  community.general.homebrew:
    name: git
    state: present

- name: git | darwin | verify git executable
  ansible.builtin.stat:
    path: "{{ git_executable_path }}"
  register: git_executable
  changed_when: false

- name: git | darwin | assert git executable exists
  ansible.builtin.assert:
    that:
      - git_executable.stat.exists
    fail_msg: "Expected git at {{ git_executable_path }} after installing git."
    success_msg: "git detected at {{ git_executable_path }}."
